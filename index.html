<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conference deadlines</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#142036;--mute:#5d6b82;--line:#dde3ec;--acc:#1f4fd8;--ok:#0b7a6b;--okbg:#dff3ef;--est:#a15a06;--estbg:#fdf0da;--past:#97a2b4}
@media(prefers-color-scheme:dark){:root{--bg:#0e141f;--card:#162030;--ink:#e6ebf4;--mute:#95a3ba;--line:#263449;--acc:#86a8ff;--ok:#4fd1bd;--okbg:#10332f;--est:#f0b45f;--estbg:#38290f;--past:#66748a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:36px 16px 72px}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--mute);max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input[type=search],select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input[type=search]{flex:1;min-width:200px}
label{display:flex;gap:6px;align-items:center;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--mute);font-size:.9rem;margin:0 0 14px}
.sw{display:inline-block;width:22px;height:14px;border:2px solid var(--ok);border-radius:4px;vertical-align:-2px;margin-right:6px}
.sw.est{border:2px dashed var(--est)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details+details{border-top:1px solid var(--line)}
summary{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▸";margin-left:auto;color:var(--mute);transition:transform .15s}
details[open]>summary::after{transform:rotate(90deg)}
summary:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.blk{flex:none;width:72px;padding:6px 4px;text-align:center;border:2px solid;border-radius:8px;line-height:1.15}
.blk b{display:block;font-size:1.7rem}.blk i{font-style:normal;font-size:.8rem}
.blk.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.blk.est{border:2px dashed var(--est);background:var(--estbg);color:var(--est)}
.blk.gone{border-color:var(--line);color:var(--past)}
.main{flex:1;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.name{font-weight:700;font-size:1.15rem;margin-right:4px}
.tag{font-size:.78rem;font-weight:700;padding:1px 9px;border-radius:99px}
.tag.rank{background:var(--line)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.est{background:var(--estbg);color:var(--est)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--mute);margin-top:2px}
.meta span+span{border-left:1px solid var(--line);padding-left:10px}
.next{margin-top:6px}.soon{color:var(--est);font-weight:700}
.body{padding:0 18px 18px 106px}
.note{background:var(--estbg);color:var(--est);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:.92rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-size:.85rem}
.dt.est{border-bottom:2px dashed var(--est)}
.dt.past{color:var(--past);text-decoration:line-through}.na{color:var(--past)}
.btn{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:8px;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:700}
.msg{padding:18px}
@media(max-width:600px){.body{padding-left:18px}.blk{width:60px}}
@media(prefers-reduced-motion:reduce){summary::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>Conference deadlines</h1>
<p class="sub">Where our group can publish computer science education research, soonest deadline first. Select a conference for every track and date.</p>
<div class="bar">
<input type="search" id="q" placeholder="Search by name or location" aria-label="Search conferences">
<select id="rank" aria-label="Filter by ICORE rank"></select>
<label><input type="checkbox" id="hide"> Hide closed</label>
</div>
<p class="legend"><span><i class="sw"></i>Confirmed dates</span><span><i class="sw est"></i>Estimated from last year’s call (marked ~), not yet confirmed</span></p>
<div class="list" id="list"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const fmt=new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short',year:'numeric'});
const mon=new Intl.DateTimeFormat('en-AU',{month:'short'});
const today=new Date();today.setHours(0,0,0,0);
const parse=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3]):null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tracksOf=c=>[{name:'Full papers',...c.fullPaper},...(c.otherTracks||[])];
let DATA=[];

function nextOf(c){
  let best=null;
  for(const t of tracksOf(c))for(const k of['abstract','full']){
    const d=parse(t[k]);
    if(d&&d>=today&&(!best||d<best.d))best={d,label:t.name+(k==='abstract'?' abstract':'')};
  }
  return best;
}
const dt=(s,est)=>{const d=parse(s);return d?`<span class="dt${est?' est':''}${d<today?' past':''}">${est?'~ ':''}${fmt.format(d)}</span>`:'<span class="na">–</span>'};

function card(c){
  const est=c.confirmed===false,n=c._next,left=n&&Math.round((n.d-today)/864e5);
  const blk=n?`<span class="blk ${est?'est':'ok'}"><b>${est?'~':''}${n.d.getDate()}</b><i>${mon.format(n.d)} ${n.d.getFullYear()}</i></span>`:'<span class="blk gone"><b>–</b><i>Closed</i></span>';
  const when=left===0?'today':left===1?'tomorrow':`in ${left} days`;
  const rows=tracksOf(c).filter(t=>t.abstract||t.full||t.notification).map(t=>`<tr><td>${esc(t.name)}</td><td>${dt(t.abstract,est)}</td><td>${dt(t.full,est)}</td><td>${dt(t.notification,est)}</td></tr>`).join('');
  const link=/^https?:\/\//.test(c.link||'')?`<a class="btn" href="${esc(c.link)}" target="_blank" rel="noopener">Open conference page</a>`:'';
  return `<details><summary>${blk}<div class="main">
<div class="head"><span class="name">${esc(c.name)}</span>${c.rank?`<span class="tag rank">ICORE ${esc(c.rank)}</span>`:''}<span class="tag ${est?'est':'ok'}">${est?'Estimated':'Confirmed'}</span></div>
<div class="meta">${c.location?`<span>${esc(c.location)}</span>`:''}${c.dates?`<span>${esc(c.dates)}</span>`:''}</div>
<div class="next">${n?`Next: ${esc(n.label)} due <span class="${left<=14?'soon':''}">${when}</span>`:'No upcoming deadlines'}</div>
</div></summary>
<div class="body">${est?'<div class="note">These dates are estimates based on last year’s call and may change. Check the conference page once the new call is out.</div>':''}
<div class="scroll"><table><tr><th>Track</th><th>Abstract due</th><th>Full paper due</th><th>Notification</th></tr>${rows||'<tr><td colspan="4">No dates entered yet.</td></tr>'}</table></div>${link}</div></details>`;
}

function render(){
  const q=$('#q').value.toLowerCase(),r=$('#rank').value,h=$('#hide').checked;
  const list=DATA.filter(c=>(!r||c.rank===r)&&(!h||c._next)&&`${c.name} ${c.location}`.toLowerCase().includes(q));
  $('#list').innerHTML=list.length?list.map(card).join(''):'<div class="msg">No conferences match. Clear the search or filters to see them all.</div>';
}

function init(json){
  DATA=(json.conferences||json).map(c=>({...c,_next:nextOf(c)}))
    .sort((a,b)=>(a._next?a._next.d:1e15)-(b._next?b._next.d:1e15)||a.name.localeCompare(b.name));
  const ranks=[...new Set(DATA.map(c=>c.rank).filter(Boolean))].sort();
  $('#rank').innerHTML='<option value="">All ICORE ranks</option>'+ranks.map(x=>`<option>${esc(x)}</option>`).join('');
  render();
}
['#q','#rank','#hide'].forEach(s=>$(s).addEventListener('input',render));

const show=h=>$('#list').innerHTML=`<div class="msg">${h}</div>`;
async function load(){
  let r;
  try{r=await fetch('conferences.json',{cache:'no-cache'})}catch{}
  if(!r||!r.ok){
    show('Couldn’t load <code>conferences.json</code>. Browsers block this when a page is opened straight from disk. Host the folder (for example on GitHub Pages) or run <code>python3 -m http.server</code> inside it. To preview now, choose the file: <input type="file" id="f" accept=".json">');
    $('#f').onchange=async e=>{try{init(JSON.parse(await e.target.files[0].text()))}catch(x){show('That file has a formatting error: '+esc(x.message))}};
    return;
  }
  try{init(JSON.parse(await r.text()))}catch(x){show('<code>conferences.json</code> has a formatting error: '+esc(x.message)+'. Check for a missing comma or quote near that position.')}
}
load();
</script>
</body>
</html>
